name: Deploy People Connect Frontend

on:
  push:
    branches: [develop, qa]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: Neonbee-ai/neonbee-devops/.github/workflows/neonbee-deploy-vite-mfe.yml@main
    with:
      service_name: people-connect-fe
      nginx_root_dev: /var/www/dev-cdn.skyoffice360.com/html/people-connect
      nginx_root_staging: /var/www/staging.people.skyoffice360.com/html
      vite_base_url_dev: https://dev-cdn.skyoffice360.com/people-connect/
      vite_base_url_staging: https://staging.people.skyoffice360.com/
      is_mfe: true
      vite_env_dev: |
        VITE_SO360_CORE_API=https://dev.api.skyoffice360.com/core
        VITE_SO360_PEOPLE_CONNECT_API=https://dev.api.skyoffice360.com/people
      vite_env_staging: |
        VITE_SO360_CORE_API=https://staging.api.skyoffice360.com/core
        VITE_SO360_PEOPLE_CONNECT_API=https://staging.api.skyoffice360.com/people
    secrets: inherit
